<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>PKS 영어 회화 연습</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:1rem;}
button,input,select{touch-action:manipulation;font-family:inherit;}
.wrap{max-width:26rem;margin:0 auto;display:flex;flex-direction:column;gap:.9rem;padding-bottom:2rem;}

.header{text-align:center;padding:.5rem 0;}
.header-name{font-size:1.2rem;font-weight:800;color:#e4e4e7;letter-spacing:.15em;text-transform:uppercase;}
.header-title{font-size:1.7rem;font-weight:700;margin-top:4px;}
.header-badge{display:inline-block;background:#1e1b4b;color:#a5b4fc;font-size:.68rem;font-weight:700;
  padding:3px 10px;border-radius:999px;letter-spacing:.06em;margin-top:.4rem;}

#status{border-radius:1rem;padding:.75rem;font-size:.875rem;text-align:center;font-weight:600;
  background:#18181b;color:#d4d4d8;transition:background .3s,color .3s;}
#status.ok{background:#052e16;color:#4ade80;}
#status.err{background:#450a0a;color:#fca5a5;}
#status.warn{background:#1c1400;color:#fde047;}
#status.talk{background:#1e1b4b;color:#a5b4fc;}

/* ── API 키 입력 ── */
#apiPanel{background:#12103a;border:1px solid #4338ca;border-radius:1rem;padding:1rem;}
#apiPanel .api-title{font-size:.82rem;font-weight:700;color:#a5b4fc;margin-bottom:.6rem;}
.api-input-row{display:flex;gap:.5rem;}
#apiKeyInput{flex:1;background:#1e1b4b;border:1px solid #4338ca;border-radius:.75rem;
  padding:.7rem .9rem;color:#e8eaf0;font-size:.88rem;outline:none;}
#apiKeyInput::placeholder{color:#4a4a6a;}
#apiKeyInput:focus{border-color:#6366f1;}
#apiSaveBtn{padding:.7rem 1rem;border-radius:.75rem;background:#6366f1;color:#fff;
  border:none;cursor:pointer;font-weight:700;font-size:.82rem;white-space:nowrap;}
#apiClearBtn{padding:.7rem .8rem;border-radius:.75rem;background:#27272a;color:#a1a1aa;
  border:none;cursor:pointer;font-weight:700;font-size:.82rem;white-space:nowrap;}
.api-hint{font-size:.68rem;color:#4a4a6a;margin-top:.4rem;}
.api-hint a{color:#6366f1;text-decoration:none;}
.api-saved-row{display:flex;align-items:center;gap:.5rem;margin-top:.5rem;
  background:#1e1b4b;border-radius:.6rem;padding:.5rem .75rem;}
.api-saved-row span{flex:1;font-size:.78rem;color:#a5b4fc;}

.option-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
.optBtn{padding:.75rem .5rem;border-radius:.85rem;border:2px solid transparent;
  cursor:pointer;font-weight:700;font-size:.78rem;text-align:center;line-height:1.3;
  background:#18181b;color:#71717a;transition:all .2s;}
.optBtn.active{border-color:#6366f1;background:#1e1b4b;color:#a5b4fc;}

#startBtn{padding:1.3rem;border-radius:1.2rem;background:#6366f1;color:#fff;
  font-weight:700;border:none;cursor:pointer;font-size:1.1rem;width:100%;transition:opacity .2s;}
#startBtn.active{animation:pulse 2s infinite;}
#startBtn:disabled{opacity:.4;cursor:not-allowed;animation:none;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,.4);}50%{box-shadow:0 0 0 10px rgba(99,102,241,0);}}
#stopBtn{padding:1.1rem;border-radius:1.2rem;background:#ef4444;color:#fff;
  font-weight:700;border:none;cursor:pointer;font-size:1rem;width:100%;}

#muteBtn{padding:.8rem;border-radius:1rem;background:#27272a;color:#d4d4d8;
  font-weight:700;border:none;cursor:pointer;font-size:.9rem;width:100%;}
#muteBtn.muted{background:#7f1d1d;color:#fca5a5;}

.timer-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
#timerDisplay{background:#18181b;border-radius:1rem;padding:.75rem 1rem;
  font-size:.95rem;font-weight:700;color:#d4d4d8;text-align:center;
  font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace;}
#wakeLockBtn{padding:.75rem 1rem;border-radius:1rem;border:none;cursor:pointer;
  font-weight:700;font-size:.82rem;background:#27272a;color:#a1a1aa;width:100%;}
#wakeLockBtn.active{background:#1c1a07;color:#facc15;}
#wakeLockBtn:disabled{opacity:.4;cursor:not-allowed;}

#chatPanel{display:none;flex-direction:column;gap:.5rem;}
#chatPanel.show{display:flex;}
.chat-box{background:#18181b;border-radius:1rem;padding:1rem;min-height:200px;max-height:45vh;
  overflow-y:auto;display:flex;flex-direction:column;gap:.6rem;}
.bubble{max-width:85%;padding:.6rem .85rem;border-radius:1rem;font-size:.88rem;line-height:1.6;word-break:break-word;}
.bubble.user{background:#1e1b4b;color:#c7d2fe;align-self:flex-end;border-bottom-right-radius:.3rem;}
.bubble.ai{background:#1a1a1a;color:#e4e4e7;align-self:flex-start;border-bottom-left-radius:.3rem;border:1px solid #27272a;}
.correction{font-size:.75rem;color:#f59e0b;margin-top:.35rem;padding-top:.35rem;border-top:1px solid #2a2a2a;}

#micIndicator{text-align:center;font-size:.8rem;color:#52525b;padding:.3rem;}
#micIndicator.on{color:#4ade80;}

details{background:#09090b;border:1px solid #27272a;border-radius:1rem;padding:.85rem;}
summary{font-weight:700;cursor:pointer;font-size:.8rem;color:#52525b;list-style:none;}
summary::-webkit-details-marker{display:none;}
#debugLog{margin-top:.6rem;font-size:.65rem;color:#71717a;white-space:pre-wrap;max-height:10rem;overflow:auto;}
.hidden{display:none!important;}
.label-sm{font-size:.78rem;color:#52525b;margin-bottom:.4rem;font-weight:600;}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="header-name">PARK KWAN SHIK</div>
    <div class="header-title">영어 회화 연습</div>
    <div class="header-badge">🎓 Gemini 2.5 Flash-Lite · 무료 1,000회/일 · 실시간 대화</div>
  </div>

  <div id="status">API 키를 입력하세요</div>

  <!-- API 키 입력 -->
  <div id="apiPanel">
    <div class="api-title">🔑 Gemini API 키</div>
    <div class="api-input-row">
      <input type="password" id="apiKeyInput" placeholder="AQ...로 시작하는 키 입력" autocomplete="off"/>
      <button id="apiSaveBtn">저장</button>
    </div>
    <div id="apiSavedRow" class="api-saved-row hidden">
      <span id="apiSavedLabel">🔐 키 저장됨: AQ••••••</span>
      <button id="apiClearBtn">변경</button>
    </div>
    <div class="api-hint">
      키는 이 기기 브라우저에만 저장됩니다 · 
      <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">키 발급 →</a>
    </div>
  </div>

  <!-- 레벨/주제 -->
  <div id="settingsPanel" style="display:none;">
    <div class="label-sm">난이도</div>
    <div class="option-row" style="margin-bottom:.9rem;">
      <button class="optBtn active" id="lvl-beginner"      data-action="level" data-value="beginner">🌱 초급<br><span style="font-weight:400;opacity:.7;font-size:.7rem;">천천히 쉬운 영어</span></button>
      <button class="optBtn"        id="lvl-intermediate"  data-action="level" data-value="intermediate">📈 중급<br><span style="font-weight:400;opacity:.7;font-size:.7rem;">일반 회화 수준</span></button>
    </div>
    <div class="label-sm">주제</div>
    <div class="option-row">
      <button class="optBtn active" id="topic-daily"    data-action="topic" data-value="daily">☕ 일상 대화</button>
      <button class="optBtn"        id="topic-business" data-action="topic" data-value="business">💼 비즈니스</button>
      <button class="optBtn"        id="topic-travel"   data-action="topic" data-value="travel">✈️ 여행</button>
      <button class="optBtn"        id="topic-free"     data-action="topic" data-value="free">🎯 자유 대화</button>
    </div>
  </div>

  <button id="startBtn" disabled>▶ 대화 시작</button>
  <button id="stopBtn" class="hidden">■ 대화 종료</button>

  <div class="timer-row">
    <div id="timerDisplay">00:00:00</div>
    <button id="wakeLockBtn">🔓 화면 꺼짐 방지</button>
  </div>

  <button id="muteBtn" class="hidden">🔊 AI 음성 켜짐 — 탭하면 음소거</button>

  <div id="chatPanel">
    <div id="micIndicator">🎤 말씀하세요...</div>
    <div class="chat-box" id="chatBox"></div>
  </div>

  <details>
    <summary>진단 로그</summary>
    <pre id="debugLog"></pre>
  </details>

</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const statusEl      = $("status");
const startBtn      = $("startBtn");
const stopBtn       = $("stopBtn");
const muteBtn       = $("muteBtn");
const chatBox       = $("chatBox");
const chatPanel     = $("chatPanel");
const apiPanel      = $("apiPanel");
const debugEl       = $("debugLog");
const micInd        = $("micIndicator");
const timerDisp     = $("timerDisplay");
const wakeLockBtn   = $("wakeLockBtn");
const settingsPanel = $("settingsPanel");
const apiSavedRow   = $("apiSavedRow");
const apiSavedLabel = $("apiSavedLabel");

// 모델 목록 (안정성 우선 순서)
const GEMINI_MODEL   = "gemini-2.5-flash-lite-preview-06-17";
const GEMINI_API_URL = (key) =>
  `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${key}`;

const MAX_LOG   = 200;
let apiKey      = "";
let recognition = null;
let isRunning   = false;
let isMuted     = false;
let isAItalking = false;
let chatHistory = [];
let level       = "beginner";
let topic       = "daily";
let timerInterval = null;
let timerStart    = 0;
let wakeLock      = null;
let wakeLockOn    = false;

// ── 유틸 ──
function setStatus(t, cls="") {
  statusEl.textContent = t;
  statusEl.className   = cls;
  log("STATUS", t);
}
function log(label, data) {
  const line = `[${new Date().toLocaleTimeString()}] ${label}: ${typeof data==="string"?data:JSON.stringify(data)}`;
  console.log(line);
  const lines = (debugEl.textContent||"").split("\n");
  if (lines.length >= MAX_LOG) lines.splice(0, lines.length - MAX_LOG + 1);
  debugEl.textContent = lines.join("\n") + "\n" + line;
  debugEl.scrollTop = debugEl.scrollHeight;
}
function addBubble(role, text) {
  const div = document.createElement("div");
  div.className    = "bubble " + role;
  div.textContent  = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}
function maskKey(k) {
  return k.slice(0, 6) + "••••••" + k.slice(-3);
}

// ── API 키 저장 UI ──
function showSavedKeyUI() {
  $("apiKeyInput").value     = "";
  $("apiKeyInput").type      = "password";
  apiSavedLabel.textContent  = `🔐 키 저장됨: ${maskKey(apiKey)}`;
  apiSavedRow.classList.remove("hidden");
  $("apiKeyInput").parentElement.style.display = "none";  // 입력행 숨기기
}
function showKeyInputUI() {
  apiSavedRow.classList.add("hidden");
  $("apiKeyInput").parentElement.style.display = "";
  $("apiKeyInput").value = "";
  $("apiKeyInput").focus();
}

function saveApiKey() {
  const val = $("apiKeyInput").value.trim();
  if (!val || !val.startsWith("AQ")) {
    setStatus("올바른 API 키를 입력하세요 (AQ...로 시작)", "err");
    return;
  }
  apiKey = val;
  try { localStorage.setItem("gemini_api_key", val); } catch(e) {}
  showSavedKeyUI();
  settingsPanel.style.display = "block";
  startBtn.disabled = false;
  setStatus("✅ API 키 저장됨. 대화 시작을 누르세요.", "ok");
  log("API", "키 저장 완료");
}

// 저장된 키 자동 로드
(function loadSavedKey() {
  try {
    const saved = localStorage.getItem("gemini_api_key");
    if (saved && saved.startsWith("AQ")) {
      apiKey = saved;
      showSavedKeyUI();
      settingsPanel.style.display = "block";
      startBtn.disabled = false;
      setStatus("✅ 준비 완료. 대화 시작을 누르세요.", "ok");
      log("API", "저장된 키 로드");
    }
  } catch(e) {}
})();

$("apiSaveBtn").addEventListener("click", saveApiKey);
$("apiClearBtn").addEventListener("click", () => {
  apiKey = "";
  startBtn.disabled = true;
  try { localStorage.removeItem("gemini_api_key"); } catch(e) {}
  showKeyInputUI();
  settingsPanel.style.display = "none";
  setStatus("API 키를 다시 입력하세요.", "warn");
  log("API", "키 삭제");
});
$("apiKeyInput").addEventListener("keydown", e => { if (e.key === "Enter") saveApiKey(); });

// ── 레벨/주제 (이벤트 위임 방식 - onclick 속성 제거) ──
document.querySelector(".wrap").addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const { action, value } = btn.dataset;
  if (action === "level") {
    level = value;
    ["beginner","intermediate"].forEach(k => $("lvl-"+k).classList.toggle("active", k===value));
  }
  if (action === "topic") {
    topic = value;
    ["daily","business","travel","free"].forEach(k => $("topic-"+k).classList.toggle("active", k===value));
  }
});

// ── 시스템 프롬프트 ──
function buildSystemPrompt() {
  const levelDesc = {
    beginner:     "Use very simple, short sentences (2-3 max). Common vocabulary only. Correct mistakes gently: [Tip: say \"...\" instead]",
    intermediate: "Use natural English. Correct significant mistakes: [Tip: say \"...\" instead]. 3-4 sentences max."
  };
  const topicDesc = {
    daily:    "Talk about everyday topics: weather, food, hobbies, daily life.",
    business: "Business English: meetings, presentations, trade shows, negotiations.",
    travel:   "Travel situations: airports, hotels, restaurants, directions.",
    free:     "Any topic the user wants."
  };
  return `You are a friendly English conversation partner helping a Korean speaker practice English.
Level: ${levelDesc[level]}
Topic: ${topicDesc[topic]}
Rules:
- Respond in English ONLY. Short and natural.
- Always end with a follow-up question.
- Never use Korean.
- If user writes Korean, encourage them to try in English.`;
}

// ── Gemini API 호출 ──
async function callGemini(userText) {
  chatHistory.push({ role: "user", parts: [{ text: userText }] });

  const body = {
    system_instruction: { parts: [{ text: buildSystemPrompt() }] },
    contents: chatHistory.slice(-14),
    generationConfig: {
      temperature: 0.75,
      maxOutputTokens: 150,
    }
  };

  const res = await fetch(GEMINI_API_URL(apiKey), {
    method:  "POST",
    headers: { "Content-Type": "application/json" },
    body:    JSON.stringify(body),
    signal:  AbortSignal.timeout(15000)
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const msg = err?.error?.message || `HTTP ${res.status}`;
    // 인증 오류 코드 정규화
    const isAuthErr = res.status === 400 || res.status === 403 || res.status === 401
                   || msg.includes("API_KEY") || msg.includes("API key");
    const e = new Error(msg);
    e.isAuth = isAuthErr;
    throw e;
  }

  const json = await res.json();

  // 안전 차단 여부 확인
  const candidate = json?.candidates?.[0];
  if (!candidate) {
    const reason = json?.promptFeedback?.blockReason || "UNKNOWN";
    throw new Error(`응답이 차단됨 (${reason})`);
  }

  const text = candidate?.content?.parts?.[0]?.text || "";
  chatHistory.push({ role: "model", parts: [{ text }] });
  return text;
}

// ── AI 응답 처리 ──
async function getAIResponse(userText) {
  isAItalking = true;
  setStatus("🤔 AI 생각 중...", "talk");

  const bubble = addBubble("ai", "▌");
  try {
    const fullText = await callGemini(userText);

    // [Tip: ...] 파싱
    const tipMatch = fullText.match(/\[Tip:[^\]]+\]/);
    let mainText = fullText, correction = "";
    if (tipMatch) {
      correction = tipMatch[0].replace(/[\[\]]/g, "").trim();
      mainText   = fullText.replace(tipMatch[0], "").trim();
    }
    bubble.textContent = mainText;
    if (correction) {
      const c = document.createElement("div");
      c.className   = "correction";
      c.textContent = "💡 " + correction;
      bubble.appendChild(c);
    }
    chatBox.scrollTop = chatBox.scrollHeight;

    speak(mainText);
    setStatus("✅ 말씀하세요!", "ok");
    micInd.textContent = "🎤 말씀하세요...";
    micInd.classList.add("on");

  } catch(err) {
    log("AI_ERR", err.message);
    bubble.textContent = "(오류: " + err.message + ")";
    setStatus("오류: " + err.message, "err");
    if (err.isAuth) {
      showKeyInputUI();
      settingsPanel.style.display = "none";
      startBtn.disabled = true;
      apiKey = "";
      try { localStorage.removeItem("gemini_api_key"); } catch(e) {}
      setStatus("API 키 오류 — 키를 다시 확인해주세요.", "err");
    }
  } finally {
    isAItalking = false;
  }
}

// ── TTS ──
function speak(text) {
  if (isMuted || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang  = "en-US";
  utt.rate  = level === "beginner" ? 0.85 : 1.0;
  const voices = window.speechSynthesis.getVoices();
  const match  = voices.find(v => v.lang === "en-US" && v.name.includes("Google"))
               || voices.find(v => v.lang === "en-US")
               || voices.find(v => v.lang.startsWith("en"));
  if (match) utt.voice = match;
  window.speechSynthesis.speak(utt);
}

// ── STT ──
function buildRecognizer() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) throw new Error("Chrome / Edge 브라우저를 사용해주세요.");
  const r = new SR();
  r.lang = "en-US"; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
  return r;
}

// ── 세션 시작 ──
async function startSession() {
  if (isRunning || !apiKey) return;
  startBtn.disabled = true;
  setStatus("마이크 권한 요청 중...", "warn");

  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    s.getTracks().forEach(t => t.stop());
  } catch(err) {
    setStatus("마이크 권한 필요: " + err.message, "err");
    startBtn.disabled = false;
    return;
  }

  chatHistory = []; chatBox.innerHTML = ""; isMuted = false;

  try { recognition = buildRecognizer(); }
  catch(err) { setStatus(err.message, "err"); startBtn.disabled = false; return; }

  let sttRestartCount = 0;
  recognition.onresult = async (e) => {
    if (isAItalking) return;
    let interim = "", finalText = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t; else interim += t;
    }
    if (interim) { micInd.textContent = "🎤 " + interim; micInd.classList.add("on"); }
    if (finalText.trim()) {
      micInd.textContent = "⏳ 처리 중..."; micInd.classList.remove("on");
      addBubble("user", finalText.trim());
      window.speechSynthesis?.cancel();
      await getAIResponse(finalText.trim());
    }
  };
  recognition.onerror = (e) => {
    const ignored = ["no-speech", "aborted"];
    if (ignored.includes(e.error)) return;
    log("STT_ERR", e.error);
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      setStatus("마이크 권한이 없습니다. 브라우저 설정을 확인하세요.", "err");
      stopSession();
    }
  };
  recognition.onend = () => {
    if (!isRunning) return;
    sttRestartCount++;
    if (sttRestartCount > 500) { log("STT","재시작 횟수 초과, 세션 종료"); stopSession(); return; }
    try { recognition.start(); } catch(e) {}
  };
  recognition.start();
  isRunning = true;

  settingsPanel.style.display = "none";
  apiPanel.style.display      = "none";
  chatPanel.classList.add("show");
  muteBtn.classList.remove("hidden");
  stopBtn.classList.remove("hidden");
  startBtn.classList.add("active");
  micInd.classList.add("on");
  setStatus("✅ 말씀하세요!", "ok");
  startTimer();
  await requestWakeLock();

  const greetings = {
    daily:    "Hi! I'm your English conversation partner. How are you doing today?",
    business: "Hello! Let's practice business English. Shall we start with a common business situation?",
    travel:   "Hi there! Let's practice travel English. Imagine you just arrived at the airport. What would you say?",
    free:     "Hey! I'm here to chat with you in English. What would you like to talk about?"
  };
  const greeting = greetings[topic];
  addBubble("ai", greeting);
  speak(greeting);
  chatHistory.push({ role: "model", parts: [{ text: greeting }] });
}

// ── 세션 종료 ──
function stopSession() {
  isRunning = false;
  if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
  window.speechSynthesis?.cancel();

  settingsPanel.style.display = "block";
  apiPanel.style.display      = "block";
  chatPanel.classList.remove("show");
  muteBtn.classList.add("hidden"); muteBtn.classList.remove("muted");
  muteBtn.textContent = "🔊 AI 음성 켜짐 — 탭하면 음소거";
  startBtn.classList.remove("active"); startBtn.disabled = !apiKey;
  stopBtn.classList.add("hidden");
  stopTimer(); releaseWakeLock();
  setStatus("종료됨. 다시 시작하려면 버튼을 누르세요.");
}

startBtn.addEventListener("click", startSession);
stopBtn.addEventListener("click",  stopSession);
window.addEventListener("beforeunload", () => { stopSession(); releaseWakeLock(); });

muteBtn.addEventListener("click", () => {
  isMuted = !isMuted;
  if (isMuted) window.speechSynthesis?.cancel();
  muteBtn.textContent = isMuted ? "🔇 음소거 중 — 탭하면 음성 켜기" : "🔊 AI 음성 켜짐 — 탭하면 음소거";
  muteBtn.classList.toggle("muted", isMuted);
});

// ── 타이머 ──
function startTimer() {
  timerStart = Date.now(); timerDisp.textContent = "00:00:00"; clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const e = Math.floor((Date.now()-timerStart)/1000);
    timerDisp.textContent = `${String(Math.floor(e/3600)).padStart(2,"0")}:${String(Math.floor((e%3600)/60)).padStart(2,"0")}:${String(e%60).padStart(2,"0")}`;
  }, 1000);
}
function stopTimer() { clearInterval(timerInterval); timerInterval=null; timerDisp.textContent="00:00:00"; }

// ── Wake Lock ──
async function requestWakeLock() {
  if (!("wakeLock" in navigator)) { wakeLockBtn.disabled=true; wakeLockBtn.textContent="미지원"; return; }
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLockOn = true; wakeLockBtn.textContent="🔒 화면 꺼짐 방지 중"; wakeLockBtn.classList.add("active");
    wakeLock.addEventListener("release", () => {
      if (wakeLockOn) { wakeLockBtn.textContent="🔓 화면 꺼짐 방지"; wakeLockBtn.classList.remove("active"); wakeLockOn=false; wakeLock=null; }
    });
  } catch(e) { log("WAKELOCK","실패: "+e.message); }
}
async function releaseWakeLock() {
  wakeLockOn=false;
  if (wakeLock) { await wakeLock.release().catch(()=>{}); wakeLock=null; }
  wakeLockBtn.textContent="🔓 화면 꺼짐 방지"; wakeLockBtn.classList.remove("active");
}
wakeLockBtn.addEventListener("click", async () => { if (wakeLockOn) await releaseWakeLock(); else await requestWakeLock(); });
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState==="visible" && wakeLockOn && !wakeLock) await requestWakeLock();
});
</script>
